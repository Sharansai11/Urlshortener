[supervisord]
nodaemon=true
user=root

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=1

[program:redis]
command=redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=2

[program:create-service]
command=java -Xmx256m -jar /app/create-service.jar --server.port=8080 --spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener --spring.datasource.username=urluser --spring.datasource.password=urlpass --spring.redis.host=localhost
autostart=true
autorestart=true
priority=3

[program:redirect-service]
command=java -Xmx256m -jar /app/redirect-service.jar --server.port=8081 --spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener --spring.datasource.username=urluser --spring.datasource.password=urlpass --spring.redis.host=localhost
autostart=true
autorestart=true
priority=4

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=5