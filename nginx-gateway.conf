worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Railway internal DNS resolver
    resolver 127.0.0.11 ipv6=off valid=5s;

    # Upstream services (Railway internal networking)
    upstream create_backend {
        server create-service.railway.internal:8080;
    }

    upstream redirect_backend {
        server redirect-service.railway.internal:8081;
    }

    server {
        listen 80;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Create URL endpoint
        location /api/create {
            proxy_pass http://create_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect endpoint
        location /api/redirect/ {
            proxy_pass http://redirect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve frontend (if you want to add it later)
        location / {
            return 200 '{"message":"URL Shortener API","endpoints":["/api/create","/api/redirect/{code}"]}';
            add_header Content-Type application/json;
        }
    }
}