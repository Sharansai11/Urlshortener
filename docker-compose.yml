services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  create-service:
    build: ./create-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_REDIS_HOST: redis
      JAVA_OPTS: "-Xmx512m -Xms256m"
    mem_limit: 768m
    depends_on:
      - postgres
      - redis
    expose:
      - "8080"

  redirect-service:
    build: ./redirect-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_REDIS_HOST: redis
      JAVA_OPTS: "-Xmx384m -Xms192m"
    mem_limit: 512m
    depends_on:
      - postgres
      - redis
    expose:
      - "8081"

  nginx:
    image: nginx:alpine
    depends_on:
      - create-service
      - redirect-service
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - nginx

volumes:
  postgres_data: